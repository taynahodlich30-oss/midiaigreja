<script>
  function switchTab(tabName) {
    // Hide all tab contents
    const contents = document.querySelectorAll('.tab-content');
    contents.forEach(el => {
      el.classList.add('hidden');
    });

    // Remove active style from all tab buttons
    const buttons = document.querySelectorAll('.tab-btn');
    buttons.forEach(btn => {
      btn.classList.remove('bg-indigo-600', 'text-white');
      btn.classList.add('bg-slate-800', 'text-slate-300', 'hover:bg-slate-700');
    });

    // Show target tab content
    const targetContent = document.getElementById(`tab-${tabName}`);
    if (targetContent) {
      targetContent.classList.remove('hidden');
    }

    // Highlight target tab button
    const targetBtn = document.getElementById(`tab-btn-${tabName}`);
    if (targetBtn) {
      targetBtn.classList.remove('bg-slate-800', 'text-slate-300', 'hover:bg-slate-700');
      targetBtn.classList.add('bg-indigo-600', 'text-white');
    }
  }

  /* ... existing code ... -->
  let padAudioCtx = null;
  let padOscillators = [];
  let padGainNode = null;
  let padFilterNode = null;
  let currentPadKey = null;
  let padVolume = 0.5;
  let padTimbre = 'warm';

  const KEY_FREQUENCIES = {
    'C': 130.81, 'C#': 138.59, 'D': 146.83, 'Eb': 155.56,
    'E': 164.81, 'F': 174.61, 'F#': 185.00, 'G': 196.00,
    'Ab': 207.65, 'A': 220.00, 'Bb': 233.08, 'B': 246.94
  };

  function initPadKeysGrid() {
    const grid = document.getElementById('pad-keys-grid');
    if (!grid) return;
    grid.innerHTML = '';

    Object.keys(KEY_FREQUENCIES).forEach(key => {
      const btn = document.createElement('button');
      btn.id = `pad-btn-${key.replace('#', 's')}`;
      btn.className = `pad-key-btn flex flex-col items-center justify-center py-4 px-3 rounded-xl border border-slate-800 bg-slate-900/80 hover:bg-indigo-900/40 hover:border-indigo-500/50 text-slate-200 transition group`;
      btn.onclick = () => playWorshipPad(key);
      btn.innerHTML = `
        <span class="text-xl font-bold group-hover:text-indigo-300 transition">${key}</span>
        <span class="text-[10px] text-slate-500 group-hover:text-indigo-400">Pad Tone</span>
      `;
      grid.appendChild(btn);
    });
  }

  function playWorshipPad(key) {
    if (!padAudioCtx) {
      padAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (padAudioCtx.state === 'suspended') {
      padAudioCtx.resume();
    }

    // Highlight UI Button
    document.querySelectorAll('.pad-key-btn').forEach(b => {
      b.classList.remove('bg-indigo-600', 'border-indigo-400', 'text-white', 'shadow-lg', 'shadow-indigo-500/20');
      b.classList.add('bg-slate-900/80', 'border-slate-800', 'text-slate-200');
    });

    const activeBtn = document.getElementById(`pad-btn-${key.replace('#', 's')}`);
    if (activeBtn) {
      activeBtn.classList.remove('bg-slate-900/80', 'border-slate-800', 'text-slate-200');
      activeBtn.classList.add('bg-indigo-600', 'border-indigo-400', 'text-white', 'shadow-lg', 'shadow-indigo-500/20');
    }

    currentPadKey = key;
    document.getElementById('current-pad-key').innerText = key;
    document.getElementById('pad-now-playing').classList.remove('hidden');

    const baseFreq = KEY_FREQUENCIES[key];
    const targetGain = padVolume;

    // Fade out existing oscillators smoothly
    if (padGainNode) {
      padGainNode.gain.setValueAtTime(padGainNode.gain.value, padAudioCtx.currentTime);
      padGainNode.gain.exponentialRampToValueAtTime(0.0001, padAudioCtx.currentTime + 1.2);
      setTimeout(() => stopOscillatorsOnly(), 1250);
    }

    setTimeout(() => {
      padGainNode = padAudioCtx.createGain();
      padFilterNode = padAudioCtx.createBiquadFilter();

      // Configure Filter based on Timbre
      padFilterNode.type = 'lowpass';
      if (padTimbre === 'warm') padFilterNode.frequency.value = 450;
      else if (padTimbre === 'bright') padFilterNode.frequency.value = 950;
      else padFilterNode.frequency.value = 650;

      padGainNode.gain.setValueAtTime(0.0001, padAudioCtx.currentTime);
      padGainNode.gain.exponentialRampToValueAtTime(Math.max(targetGain, 0.01), padAudioCtx.currentTime + 2.5);

      // Create warm triad synth chord (Root, Fifth, Octave, Octave + 3rd)
      const intervals = [0.5, 1, 1.498, 2, 2.52]; // Soft drone voicing
      padOscillators = intervals.map(mult => {
        const osc = padAudioCtx.createOscillator();
        osc.type = padTimbre === 'organ' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(baseFreq * mult, padAudioCtx.currentTime);
        osc.connect(padFilterNode);
        osc.start();
        return osc;
      });

      padFilterNode.connect(padGainNode);
      padGainNode.connect(padAudioCtx.destination);
    }, padGainNode ? 600 : 0);
  }

  function stopOscillatorsOnly() {
    padOscillators.forEach(osc => {
      try { osc.stop(); osc.disconnect(); } catch (e) {}
    });
    padOscillators = [];
  }

  function stopWorshipPad() {
    if (padGainNode && padAudioCtx) {
      padGainNode.gain.setValueAtTime(padGainNode.gain.value, padAudioCtx.currentTime);
      padGainNode.gain.exponentialRampToValueAtTime(0.0001, padAudioCtx.currentTime + 1.0);
      setTimeout(() => {
        stopOscillatorsOnly();
        document.getElementById('pad-now-playing').classList.add('hidden');
        document.querySelectorAll('.pad-key-btn').forEach(b => {
          b.classList.remove('bg-indigo-600', 'border-indigo-400', 'text-white', 'shadow-lg');
          b.classList.add('bg-slate-900/80', 'border-slate-800', 'text-slate-200');
        });
        currentPadKey = null;
      }, 1000);
    }
  }

  function updatePadVolume(val) {
    padVolume = parseFloat(val);
    document.getElementById('pad-vol-text').innerText = Math.round(padVolume * 100) + '%';
    if (padGainNode && padAudioCtx) {
      padGainNode.gain.setValueAtTime(padGainNode.gain.value, padAudioCtx.currentTime);
      padGainNode.gain.linearRampToValueAtTime(padVolume, padAudioCtx.currentTime + 0.1);
    }
  }

  function changePadTimbre(val) {
    padTimbre = val;
    if (currentPadKey) {
      playWorshipPad(currentPadKey);
    }
  }

  // -------------------------------------------------------------
  // FEATURE 2: ESCALAS & CONFIRMAÇÃO DE PRESENÇA
  // -------------------------------------------------------------
  let rosterData = JSON.parse(localStorage.getItem('cep_rosters')) || [
    {
      id: 1,
      date: 'Domingo, 20 Out - 19:00',
      serviceName: 'Culto de Celebração',
      leader: 'Pr. Lucas',
      members: [
        { role: 'Líder / Voz', name: 'Mateus Silva', status: 'confirmed' },
        { role: 'Violão / Bateria', name: 'João Santos', status: 'pending' },
        { role: 'Teclado', name: 'Felipe Costa', status: 'swap_requested' },
        { role: 'Mídia / Projeção', name: 'Ana Souza', status: 'confirmed' }
      ]
    },
    {
      id: 2,
      date: 'Quarta, 23 Out - 19:30',
      serviceName: 'Culto da Família',
      leader: 'Ev. Carlos',
      members: [
        { role: 'Voz Principal', name: 'Beatriz Lima', status: 'confirmed' },
        { role: 'Violão', name: 'Mateus Silva', status: 'confirmed' },
        { role: 'Som / Áudio', name: 'Gabriel Rocha', status: 'pending' }
      ]
    }
  ];

  function renderRoster() {
    const container = document.getElementById('roster-list-container');
    if (!container) return;
    container.innerHTML = '';

    rosterData.forEach((roster, rIdx) => {
      const card = document.createElement('div');
      card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-lg flex flex-col justify-between';
      
      let membersHtml = roster.members.map((m, mIdx) => {
        let statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">Pendente</span>`;
        if (m.status === 'confirmed') {
          statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Confirmado</span>`;
        } else if (m.status === 'swap_requested') {
          statusBadge = `<span class="px-2 py-0.5 text-[11px] rounded bg-rose-500/20 text-rose-300 border border-rose-500/30 flex items-center gap-1"><i data-lucide="repeat" class="w-3 h-3"></i> Troca Solicitada</span>`;
        }

        return `
          <div class="p-3 bg-slate-950/60 rounded-lg border border-slate-800/80 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs text-indigo-400 font-semibold uppercase tracking-wider block">${m.role}</span>
                <span class="text-sm font-medium text-slate-100">${m.name}</span>
              </div>
              ${statusBadge}
            </div>
            <!-- Action Buttons for Attendance -->
            <div class="flex items-center gap-2 pt-1 border-t border-slate-800/50">
              <button onclick="updateMemberAttendance(${rIdx}, ${mIdx}, 'confirmed')" class="flex-1 py-1 px-2 bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-300 text-xs rounded border border-emerald-500/30 transition flex items-center justify-center gap-1">
                <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> Confirmar
              </button>
              <button onclick="updateMemberAttendance(${rIdx}, ${mIdx}, 'swap_requested')" class="flex-1 py-1 px-2 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 text-xs rounded border border-rose-500/30 transition flex items-center justify-center gap-1">
                <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i> Pedir Troca
              </button>
            </div>
          </div>
        `;
      }).join('');

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-950 text-indigo-300 border border-indigo-800/60 rounded-full">${roster.serviceName}</span>
            <span class="text-xs text-slate-400">${roster.leader}</span>
          </div>
          <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
            <i data-lucide="calendar" class="w-4 h-4 text-indigo-400"></i> ${roster.date}
          </h3>
          <div class="space-y-2.5">
            ${membersHtml}
          </div>
        </div>
      `;
      container.appendChild(card);
    });
    lucide.createIcons();
  }

  function updateMemberAttendance(rosterIdx, memberIdx, status) {
    rosterData[rosterIdx].members[memberIdx].status = status;
    localStorage.setItem('cep_rosters', JSON.stringify(rosterData));
    renderRoster();
  }

  // -------------------------------------------------------------
  // FEATURE 3: TELEPROMPTER / FULLSCREEN PROJECTION MODE
  // -------------------------------------------------------------
  let currentTeleprompterSong = null;
  let teleprompterFontSize = 32;
  let teleprompterScrollInterval = null;

  function openTeleprompterMode() {
    if (!currentActiveSong) return;
    currentTeleprompterSong = currentActiveSong;

    document.getElementById('teleprompter-title').innerText = currentTeleprompterSong.title;
    document.getElementById('teleprompter-key-tag').innerText = `Tom: ${currentTeleprompterSong.key || 'N/A'}`;

    // Clean chords from text to leave only clean lyrics for projection
    let lyricsClean = currentTeleprompterSong.chords
      .replace(/\[.*?\]/g, '') // remove brackets
      .replace(/^[A-G][b#]?(m|maj|min|dim|aug|sus|add)?[0-9]*.*$/gm, '') // remove pure chord lines
      .split('\n')
      .filter(line => line.trim() !== '')
      .join('<br>');

    document.getElementById('teleprompter-text').innerHTML = lyricsClean || currentTeleprompterSong.chords.replace(/\n/g, '<br>');
    document.getElementById('teleprompter-modal').classList.remove('hidden');
    lucide.createIcons();
  }

  function closeTeleprompterMode() {
    if (teleprompterScrollInterval) {
      clearInterval(teleprompterScrollInterval);
      teleprompterScrollInterval = null;
    }
    document.getElementById('teleprompter-modal').classList.add('hidden');
  }

  function changeTeleprompterFontSize(delta) {
    teleprompterFontSize = Math.max(18, Math.min(64, teleprompterFontSize + delta));
    document.getElementById('teleprompter-text').style.fontSize = `${teleprompterFontSize}px`;
  }

  function toggleTeleprompterAutoScroll() {
    const container = document.getElementById('teleprompter-content-container');
    const btn = document.getElementById('teleprompter-scroll-btn');

    if (teleprompterScrollInterval) {
      clearInterval(teleprompterScrollInterval);
      teleprompterScrollInterval = null;
      btn.innerHTML = `<i data-lucide="play" class="w-3.5 h-3.5"></i> Rolagem Auto`;
    } else {
      teleprompterScrollInterval = setInterval(() => {
        container.scrollTop += 1;
      }, 40);
      btn.innerHTML = `<i data-lucide="pause" class="w-3.5 h-3.5"></i> Pausar Rolagem`;
    }
    lucide.createIcons();
  }

  function toggleFullScreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }
  }

  // Initialize features on load
  window.addEventListener('DOMContentLoaded', () => {
    initPadKeysGrid();
    renderRoster();
  });
</script>
