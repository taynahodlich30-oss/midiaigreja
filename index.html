<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Ministérios • CEP Pirapozinho</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>html{scroll-behavior:smooth}body{font-family:Inter,system-ui,sans-serif}.glass{background:rgba(15,23,42,.82);backdrop-filter:blur(12px)}.tab{white-space:nowrap}.active{background:#4f46e5!important;color:white!important}.pad-active{background:#4f46e5!important;border-color:#818cf8!important;color:white!important}.hide-scrollbar::-webkit-scrollbar{display:none}.hide-scrollbar{scrollbar-width:none}</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
<header class="sticky top-0 z-40 border-b border-slate-800 glass"><div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4"><div><div class="text-xs uppercase tracking-[.25em] text-indigo-400 font-bold">CEP Pirapozinho</div><h1 class="text-xl sm:text-2xl font-bold">Portal de Ministérios</h1></div><button onclick="openModal('quickModal')" class="px-3 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold"><i data-lucide="plus" class="w-4 h-4 inline"></i> Novo</button></div></header>
<main class="max-w-7xl mx-auto px-4 py-6">
<section id="dashboard" class="grid lg:grid-cols-3 gap-4 mb-6"><div class="lg:col-span-2 rounded-2xl border border-slate-800 bg-gradient-to-br from-indigo-950 to-slate-900 p-6"><p class="text-indigo-300 text-sm font-semibold">CENTRAL DA EQUIPE</p><h2 class="text-2xl sm:text-3xl font-bold mt-1">Tudo para o próximo culto em um só lugar.</h2><p class="text-slate-400 mt-2">Escalas, músicas, pads, agenda, avisos e equipe.</p><div class="flex flex-wrap gap-2 mt-5"><button onclick="switchTab('roster')" class="px-4 py-2 rounded-lg bg-white text-slate-900 font-semibold">Ver escala</button><button onclick="switchTab('repertoire')" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold">Músicas</button><button onclick="switchTab('pads')" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 font-semibold">Worship Pads</button></div></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex justify-between"><span class="text-slate-400 text-sm">Próximo culto</span><i data-lucide="calendar-days" class="text-indigo-400"></i></div><div id="nextService" class="mt-3"></div></div></section>
<nav class="flex gap-2 overflow-x-auto hide-scrollbar border-b border-slate-800 pb-3 mb-6"><button class="tab active px-4 py-2 rounded-lg bg-slate-800" id="tab-btn-roster" onclick="switchTab('roster')">Escalas</button><button class="tab px-4 py-2 rounded-lg bg-slate-800 text-slate-300" id="tab-btn-repertoire" onclick="switchTab('repertoire')">Músicas & Cifras</button><button class="tab px-4 py-2 rounded-lg bg-slate-800 text-slate-300" id="tab-btn-pads" onclick="switchTab('pads')">🎹 Pads</button><button class="tab px-4 py-2 rounded-lg bg-slate-800 text-slate-300" id="tab-btn-calendar" onclick="switchTab('calendar')">Agenda</button><button class="tab px-4 py-2 rounded-lg bg-slate-800 text-slate-300" id="tab-btn-notices" onclick="switchTab('notices')">Avisos</button><button class="tab px-4 py-2 rounded-lg bg-slate-800 text-slate-300" id="tab-btn-team" onclick="switchTab('team')">Equipe</button></nav>
<div id="tab-roster" class="tab-content"></div>
<div id="tab-repertoire" class="tab-content hidden"></div>
<div id="tab-pads" class="tab-content hidden"></div>
<div id="tab-calendar" class="tab-content hidden"></div>
<div id="tab-notices" class="tab-content hidden"></div>
<div id="tab-team" class="tab-content hidden"></div>
</main>

<div id="songModal" class="hidden fixed inset-0 z-50 bg-black/80 p-4 flex items-center justify-center"><div class="w-full max-w-4xl max-h-[92vh] overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 flex flex-col"><div class="p-4 border-b border-slate-800 flex justify-between"><div><h3 id="songTitle" class="font-bold text-xl"></h3><p id="songMeta" class="text-sm text-slate-400"></p></div><button onclick="closeModal('songModal')"><i data-lucide="x"></i></button></div><div id="songBody" class="p-5 overflow-auto"></div></div></div>
<div id="teleprompter" class="hidden fixed inset-0 z-[60] bg-black flex flex-col"><div class="p-3 sm:p-4 bg-slate-950 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3"><div><b id="tpTitle">Telão</b><span id="tpKey" class="ml-2 text-xs text-indigo-300"></span></div><div class="flex gap-2"><button onclick="tpFont(-4)" class="px-3 py-2 bg-slate-800 rounded">A−</button><button onclick="tpFont(4)" class="px-3 py-2 bg-slate-800 rounded">A+</button><button onclick="tpScroll()" id="tpScrollBtn" class="px-3 py-2 bg-indigo-600 rounded">▶ Rolagem</button><button onclick="document.documentElement.requestFullscreen?.()" class="px-3 py-2 bg-slate-800 rounded">⛶</button><button onclick="closeTeleprompter()" class="px-3 py-2 bg-red-600 rounded">Sair</button></div></div><div id="tpContent" class="flex-1 overflow-y-auto px-6 sm:px-16 py-12 text-center"><div id="tpText" class="max-w-5xl mx-auto font-bold leading-relaxed"></div></div></div>
<div id="quickModal" class="hidden fixed inset-0 z-50 bg-black/70 p-4 flex items-center justify-center"><div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md"><div class="flex justify-between"><h3 class="text-xl font-bold">Criar rápido</h3><button onclick="closeModal('quickModal')"><i data-lucide="x"></i></button></div><div class="grid gap-3 mt-5"><button onclick="closeModal('quickModal');switchTab('calendar');addService()" class="p-4 bg-slate-800 rounded-xl text-left">📅 Novo culto</button><button onclick="closeModal('quickModal');switchTab('repertoire');addSong()" class="p-4 bg-slate-800 rounded-xl text-left">🎵 Nova música</button><button onclick="closeModal('quickModal');switchTab('notices');addNotice()" class="p-4 bg-slate-800 rounded-xl text-left">📢 Novo aviso</button><button onclick="closeModal('quickModal');switchTab('team');addMember()" class="p-4 bg-slate-800 rounded-xl text-left">👤 Novo integrante</button></div></div></div>
<script>
const keyFreq={C:130.81,'C#':138.59,D:146.83,Eb:155.56,E:164.81,F:174.61,'F#':185,G:196,Ab:207.65,A:220,Bb:233.08,B:246.94};
let songs=JSON.parse(localStorage.getItem('cep_songs')||'null')||[{id:1,title:'Exemplo de Louvor',artist:'Equipe CEP',key:'A',lyrics:'[A] Tua presença está aqui\n[F#m] Nós Te adoramos\n[D] Recebe nossa canção\n[E] E todo nosso coração'}];
let rosters=JSON.parse(localStorage.getItem('cep_rosters')||'null')||[{id:1,date:'2026-09-20',time:'19:00',name:'Culto de Celebração',leader:'Líder do Louvor',members:[{name:'Mateus',role:'Voz',status:'pending'},{name:'João',role:'Violão',status:'pending'},{name:'Felipe',role:'Teclado',status:'pending'}]}];
let services=JSON.parse(localStorage.getItem('cep_services')||'null')||[{id:1,date:'2026-09-20',time:'19:00',name:'Culto de Celebração',leader:'Líder do Louvor'}];
let notices=JSON.parse(localStorage.getItem('cep_notices')||'null')||[{id:1,title:'Ensaio',text:'Confirme sua presença na escala e chegue com antecedência.'}];
let team=JSON.parse(localStorage.getItem('cep_team')||'null')||[{id:1,name:'Mateus',role:'Voz / Instrumento',phone:''}];
const save=()=>{localStorage.setItem('cep_songs',JSON.stringify(songs));localStorage.setItem('cep_rosters',JSON.stringify(rosters));localStorage.setItem('cep_services',JSON.stringify(services));localStorage.setItem('cep_notices',JSON.stringify(notices));localStorage.setItem('cep_team',JSON.stringify(team));};
function switchTab(t){document.querySelectorAll('.tab-content').forEach(x=>x.classList.add('hidden'));document.getElementById('tab-'+t).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-btn-'+t).classList.add('active');render();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});}
function renderRoster(){let el=document.getElementById('tab-roster');el.innerHTML=`<div class="flex items-center justify-between mb-4"><div><h2 class="text-2xl font-bold">Escalas & Presença</h2><p class="text-slate-400 text-sm">Confirme, recuse ou solicite troca diretamente pelo navegador.</p></div><button onclick="addRoster()" class="px-3 py-2 bg-indigo-600 rounded-lg">+ Nova escala</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${rosters.map((r,ri)=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between gap-2"><span class="text-indigo-300 text-xs font-bold uppercase">${esc(r.name)}</span><button onclick="deleteRoster(${ri})" class="text-slate-500">×</button></div><h3 class="font-bold mt-2">${fmt(r.date)} • ${r.time}</h3><p class="text-xs text-slate-400">Líder: ${esc(r.leader)}</p><div class="space-y-2 mt-4">${r.members.map((m,mi)=>`<div class="p-3 rounded-lg bg-slate-950 border border-slate-800"><div class="flex justify-between"><div><b>${esc(m.name)}</b><div class="text-xs text-indigo-400">${esc(m.role)}</div></div><span class="text-xs ${m.status==='confirmed'?'text-emerald-400':m.status==='declined'?'text-red-400':'text-amber-400'}">${m.status==='confirmed'?'✓ Confirmado':m.status==='declined'?'✕ Recusou':'• Pendente'}</span></div><div class="grid grid-cols-3 gap-1 mt-2"><button onclick="attendance(${ri},${mi},'confirmed')" class="text-xs py-2 rounded bg-emerald-900/40">Confirmar</button><button onclick="attendance(${ri},${mi},'declined')" class="text-xs py-2 rounded bg-red-900/40">Recusar</button><button onclick="attendance(${ri},${mi},'swap')" class="text-xs py-2 rounded bg-amber-900/40">Troca</button></div></div>`).join('')}</div><button onclick="addRosterMember(${ri})" class="w-full mt-3 py-2 border border-dashed border-slate-700 rounded-lg text-sm">+ Integrante</button></article>`).join('')}</div>`}
function attendance(ri,mi,status){rosters[ri].members[mi].status=status;save();renderRoster();}
function addRoster(){let name=prompt('Nome da escala/culto:','Culto de Celebração');if(!name)return;let date=prompt('Data (AAAA-MM-DD):','2026-09-27');let time=prompt('Horário:','19:00');let leader=prompt('Líder:','');rosters.push({id:Date.now(),date,time,name,leader,members:[]});save();renderRoster();}
function addRosterMember(ri){let name=prompt('Nome do integrante:');if(!name)return;let role=prompt('Função/instrumento:','');rosters[ri].members.push({name,role,status:'pending'});save();renderRoster();}
function deleteRoster(i){if(confirm('Excluir esta escala?')){rosters.splice(i,1);save();renderRoster();}}
function renderSongs(){let el=document.getElementById('tab-repertoire');el.innerHTML=`<div class="flex items-center justify-between mb-4"><div><h2 class="text-2xl font-bold">Músicas & Cifras</h2><p class="text-slate-400 text-sm">Abra a cifra, transponha o tom e envie para o modo telão.</p></div><button onclick="addSong()" class="px-3 py-2 bg-indigo-600 rounded-lg">+ Música</button></div><input oninput="renderSongs(this.value)" placeholder="Buscar música..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 mb-4" value="${esc(window.songFilter||'')}"><div class="grid md:grid-cols-2 gap-4">${songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes((window.songFilter||'').toLowerCase())).map((s,i)=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between"><div><h3 class="font-bold">${esc(s.title)}</h3><p class="text-sm text-slate-400">${esc(s.artist)} • Tom ${esc(s.key)}</p></div><button onclick="deleteSong(${i})" class="text-slate-500">×</button></div><button onclick="openSong(${i})" class="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-lg">Abrir cifra</button></article>`).join('')}</div>`;}
function openSong(i){let s=songs[i];document.getElementById('songTitle').textContent=s.title;document.getElementById('songMeta').textContent=`${s.artist} • Tom ${s.key}`;document.getElementById('songBody').innerHTML=`<div class="flex flex-wrap gap-2 mb-4"><button onclick="transposeSong(${i},-1)" class="px-3 py-2 bg-slate-800 rounded">− Tom</button><button onclick="transposeSong(${i},1)" class="px-3 py-2 bg-slate-800 rounded">+ Tom</button><button onclick="openTeleprompter(${i})" class="px-3 py-2 bg-emerald-700 rounded">📺 Abrir Telão</button></div><pre class="whitespace-pre-wrap font-mono text-base leading-8 text-slate-200">${esc(s.lyrics)}</pre>`;openModal('songModal');}
const notes=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function transposeSong(i,d){let s=songs[i],p=notes.indexOf(s.key);s.key=notes[(p+d+12)%12];s.lyrics=s.lyrics.replace(/\[([A-G](?:#|b)?m?)\]/g,(_,c)=>{let base=c.replace('m',''),m=c.endsWith('m')?'m':'';let x=notes.indexOf(base);return x<0?`[${c}]`:`[${notes[(x+d+12)%12]}${m}]`});save();openSong(i);}
function addSong(){let title=prompt('Nome da música:');if(!title)return;let artist=prompt('Artista/compositor:','');let key=prompt('Tom:','A');let lyrics=prompt('Cole a letra/cifra aqui:','');songs.push({id:Date.now(),title,artist,key,lyrics});save();renderSongs();}
function deleteSong(i){if(confirm('Excluir música?')){songs.splice(i,1);save();renderSongs();}}
let audio=null,gain=null,osc=[],padVol=.35,padKey=null,autoPad=false;
function renderPads(){let el=document.getElementById('tab-pads');el.innerHTML=`<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5"><div class="flex flex-wrap justify-between gap-3"><div><h2 class="text-2xl font-bold">🎹 Worship Pads</h2><p class="text-slate-400 text-sm">Drone contínuo para oração, ministração e transições.</p></div><button onclick="stopPad()" class="px-4 py-2 bg-red-700/60 rounded-lg">■ Parar</button></div><div class="mt-5 grid sm:grid-cols-2 gap-4"><label class="text-sm">Volume <input id="padVol" type="range" min="0" max="1" step=".01" value="${padVol}" oninput="padVol=+this.value;document.getElementById('pv').textContent=Math.round(padVol*100)+'%';if(gain)gain.gain.value=padVol" class="w-full accent-indigo-500"><span id="pv">${Math.round(padVol*100)}%</span></label><label class="text-sm">Timbre<select id="padTone" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-lg p-2"><option value="warm">Warm & Deep</option><option value="bright">Celestial</option><option value="organ">Soft Organ</option></select></label></div><div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2 mt-5">${Object.keys(keyFreq).map(k=>`<button id="pad-${k.replace('#','s')}" onclick="playPad('${k}')" class="padkey p-4 rounded-xl bg-slate-950 border border-slate-800 font-bold">${k}</button>`).join('')}</div><div id="padState" class="hidden mt-5 p-4 rounded-xl bg-indigo-950 border border-indigo-800">Tocando Pad em <b id="padStateKey"></b></div></div>`;}
function playPad(k){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();stopPad(false);let g=audio.createGain(),filter=audio.createBiquadFilter();gain=g;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.01,padVol),audio.currentTime+2);let type=document.getElementById('padTone').value;filter.type='lowpass';filter.frequency.value=type==='warm'?500:type==='bright'?1200:750;filter.connect(g);g.connect(audio.destination);[.5,1,1.498,2,2.52].forEach(mult=>{let o=audio.createOscillator();o.type=type==='organ'?'triangle':'sine';o.frequency.value=keyFreq[k]*mult;o.connect(filter);o.start();osc.push(o)});padKey=k;document.querySelectorAll('.padkey').forEach(b=>b.classList.remove('pad-active'));document.getElementById('pad-'+k.replace('#','s'))?.classList.add('pad-active');document.getElementById('padState').classList.remove('hidden');document.getElementById('padStateKey').textContent=k;}
function stopPad(show=true){if(gain&&audio){gain.gain.cancelScheduledValues(audio.currentTime);gain.gain.setTargetAtTime(.0001,audio.currentTime,.2);setTimeout(()=>osc.forEach(o=>{try{o.stop()}catch(e){}}),900)}osc=[];gain=null;if(show){document.querySelectorAll('.padkey').forEach(b=>b.classList.remove('pad-active'));document.getElementById('padState')?.classList.add('hidden');}}
let tpSize=38,tpTimer=null;function openTeleprompter(i){let s=songs[i];document.getElementById('tpTitle').textContent=s.title;document.getElementById('tpKey').textContent='Tom '+s.key;document.getElementById('tpText').innerHTML=esc(s.lyrics.replace(/\[[^\]]+\]/g,'')).replace(/\n/g,'<br>');document.getElementById('tpText').style.fontSize=tpSize+'px';document.getElementById('teleprompter').classList.remove('hidden');closeModal('songModal');}
function closeTeleprompter(){document.getElementById('teleprompter').classList.add('hidden');clearInterval(tpTimer);tpTimer=null;}
function tpFont(d){tpSize=Math.max(18,Math.min(72,tpSize+d));document.getElementById('tpText').style.fontSize=tpSize+'px';}
function tpScroll(){let c=document.getElementById('tpContent');if(tpTimer){clearInterval(tpTimer);tpTimer=null;document.getElementById('tpScrollBtn').textContent='▶ Rolagem';}else{tpTimer=setInterval(()=>c.scrollTop+=1,45);document.getElementById('tpScrollBtn').textContent='⏸ Pausar';}}
function renderCalendar(){document.getElementById('tab-calendar').innerHTML=`<div class="flex justify-between mb-4"><div><h2 class="text-2xl font-bold">Agenda de Cultos</h2><p class="text-slate-400">Organize datas, líderes e observações.</p></div><button onclick="addService()" class="px-3 py-2 bg-indigo-600 rounded-lg">+ Culto</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${services.map((s,i)=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><span class="text-indigo-400 text-sm">${fmt(s.date)}</span><h3 class="font-bold text-lg mt-1">${esc(s.name)}</h3><p class="text-slate-400">${s.time} • ${esc(s.leader)}</p><button onclick="deleteService(${i})" class="mt-4 text-xs text-red-400">Excluir</button></article>`).join('')}</div>`;}
function addService(){let name=prompt('Nome do culto:');if(!name)return;services.push({id:Date.now(),date:prompt('Data (AAAA-MM-DD):','2026-09-27'),time:prompt('Horário:','19:00'),name,leader:prompt('Líder:','')});save();renderCalendar();renderDashboard();}
function deleteService(i){if(confirm('Excluir culto?')){services.splice(i,1);save();renderCalendar();renderDashboard();}}
function renderNotices(){document.getElementById('tab-notices').innerHTML=`<div class="flex justify-between mb-4"><div><h2 class="text-2xl font-bold">Avisos & Ideias</h2><p class="text-slate-400">Comunicação rápida com a equipe.</p></div><button onclick="addNotice()" class="px-3 py-2 bg-indigo-600 rounded-lg">+ Aviso</button></div><div class="grid md:grid-cols-2 gap-4">${notices.map((n,i)=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="flex justify-between"><h3 class="font-bold">${esc(n.title)}</h3><button onclick="deleteNotice(${i})">×</button></div><p class="text-slate-400 mt-2">${esc(n.text)}</p></article>`).join('')}</div>`;}
function addNotice(){let title=prompt('Título:');if(!title)return;notices.unshift({id:Date.now(),title,text:prompt('Mensagem:','')});save();renderNotices();}
function deleteNotice(i){notices.splice(i,1);save();renderNotices();}
function renderTeam(){document.getElementById('tab-team').innerHTML=`<div class="flex justify-between mb-4"><div><h2 class="text-2xl font-bold">Equipe & Contatos</h2><p class="text-slate-400">Cadastro simples dos integrantes.</p></div><button onclick="addMember()" class="px-3 py-2 bg-indigo-600 rounded-lg">+ Integrante</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${team.map((m,i)=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><div class="w-11 h-11 rounded-full bg-indigo-600/30 grid place-items-center text-indigo-300 font-bold">${esc(m.name[0]||'?')}</div><h3 class="font-bold mt-3">${esc(m.name)}</h3><p class="text-indigo-400 text-sm">${esc(m.role)}</p><p class="text-slate-400 text-sm mt-2">${esc(m.phone)||'Sem telefone cadastrado'}</p><button onclick="deleteMember(${i})" class="mt-3 text-xs text-red-400">Excluir</button></article>`).join('')}</div>`;}
function addMember(){let name=prompt('Nome:');if(!name)return;team.push({id:Date.now(),name,role:prompt('Função/instrumento:',''),phone:prompt('Telefone/WhatsApp:','')});save();renderTeam();}
function deleteMember(i){team.splice(i,1);save();renderTeam();}
function renderDashboard(){let s=services.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];document.getElementById('nextService').innerHTML=s?`<div class="text-lg font-bold">${esc(s.name)}</div><div class="text-indigo-300 mt-1">${fmt(s.date)} às ${s.time}</div><div class="text-xs text-slate-500 mt-2">Líder: ${esc(s.leader)}</div>`:'<span class="text-slate-500">Nenhum culto cadastrado.</span>';}
function render(){renderDashboard();renderRoster();renderSongs();renderPads();renderCalendar();renderNotices();renderTeam();lucide.createIcons();}
function openModal(id){document.getElementById(id).classList.remove('hidden')}function closeModal(id){document.getElementById(id).classList.add('hidden')}
window.addEventListener('DOMContentLoaded',()=>{render();});
</script></body></html>
