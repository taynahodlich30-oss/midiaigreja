name: Lembretes das escalas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar-lembretes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o portal
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Firebase Admin
        run: npm install --no-save firebase-admin@13

      - name: Verificar escalas e enviar notificações
        run: node .github/scripts/send-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
