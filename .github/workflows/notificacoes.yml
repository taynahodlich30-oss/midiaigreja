name: Notificações do portal

# Roda a cada 15 minutos: versículo do dia (7h) e lembretes da escala
# (véspera 19h, no dia 8h e 1 hora antes), no horário de Brasília.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste = avisa líderes e admin · versiculo = manda o versículo agora · automatico = rotina normal'
        type: choice
        default: teste
        options: [teste, versiculo, automatico]

concurrency:
  group: notificacoes
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: notificacoes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar
        working-directory: notificacoes
        run: npm install --omit=dev --no-audit --no-fund
      - name: Enviar notificações
        working-directory: notificacoes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODO: ${{ github.event.inputs.modo || 'automatico' }}
        run: node enviar.js
